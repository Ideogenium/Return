openapi: 3.1.0

info:
  title: Return API
  version: 1.1.0
  description: |
    **Return** — API de gestion de prêts d'objets personnels et d'argent.

    Cette API permet de :
    - Gérer des prêts d'objets (photo, retour physique) et d'argent (montant, remboursement)
    - Suivre le cycle de vie complet d'un prêt (création, confirmation, rappels, retour)
    - Planifier et envoyer des rappels automatiques diplomatiques (PREVENTIVE adaptatif J-3/J-1, J, J+7, J+14, J+21)
    - Consulter l'historique et les statistiques de prêts

    **Architecture** : Monolithe Modulaire (NestJS 11.x + PostgreSQL 17+)
    **Authentification** : JWT (Bearer Token) avec révocation immédiate via Redis
    **Standards** : RFC 7807 pour toutes les erreurs, i18n FR/EN
    **Validation** : class-validator + class-transformer

    **Règle 404 / 403 (ressources d'un autre utilisateur)** :
    - Quand l'appelant **n'est pas partie** à la ressource (tiers : prêt, objet, photo, contact, rappel,
      invitation ou notification d'un autre utilisateur), l'API répond **404**. Cette réponse est
      strictement identique à celle d'une ressource inexistante (même `type`, même `title`, même `detail`),
      pour qu'on ne puisse pas deviner l'existence d'une ressource en testant des identifiants.
    - Le **403** n'est renvoyé que lorsque l'appelant **est partie** à la ressource mais n'a pas le droit
      d'effectuer l'action (ex. l'emprunteur d'un prêt qui tente une action réservée au prêteur).
    - **Invitations de contact** : seule la personne autorisée à l'action voit la ressource (destinataire pour
      accepter ou refuser, émetteur pour annuler) ; tout autre utilisateur, y compris l'autre partie de
      l'invitation, reçoit le 404.
    - Les statistiques de fiabilité d'un emprunteur (`Borrower.statistics`) ne sont visibles que du prêteur.

    **Corps de requête refusés avant toute route** (règle transversale, valable pour toutes les routes) :
    - Un corps JSON de plus de **100 Ko** (102 400 octets) reçoit un **413**
      (`#/components/responses/PayloadTooLarge`, `type` `payload-too-large`).
    - Un corps dont le jeu de caractères ou l'encodage n'est pas pris en charge reçoit un **415**
      (`#/components/responses/UnsupportedMediaType`, `type` générique `http-error`).
    - Ces deux réponses ne sont pas répétées sur chaque route : elles sont produites par le lecteur du corps,
      avant la route, et sont identiques partout.
    - Les fichiers envoyés en `multipart/form-data` (photos d'objet, avatar) ont leurs propres limites et
      reçoivent un **400** avec une erreur sur le champ du fichier (`photo` ou `avatar`) : `TOO_LARGE` au-delà
      de la taille autorisée, `FILE_REQUIRED` s'il est absent ou d'un type refusé, `VALIDATION_ERROR` si le
      corps multipart est refusé (fichier en trop, trop de champs, champ trop long, corps mal formé).

  contact:
    name: Return Support
    email: support@return.app
    url: https://return.app/support
  license:
    name: Proprietary
    url: https://return.app/license

servers:
  - url: https://api.return.app/v1
    description: Production (Fly.io — Europe West)
  - url: http://localhost:3000/v1
    description: Développement local

tags:
  - name: Authentication
    description: Inscription, connexion et gestion de session
  - name: Loans
    description: Gestion du cycle de vie des prêts
  - name: Items
    description: Gestion des objets prêtables
  - name: Borrowers
    description: Gestion des emprunteurs (compte obligatoire)
  - name: Reminders
    description: Système de rappels automatiques
  - name: Notifications
    description: Gestion des notifications push (V1)
  - name: Users
    description: Profil utilisateur et paramètres
  - name: History
    description: Historique et statistiques des prêts
  - name: ContactInvitations
    description: Gestion des invitations entre utilisateurs (recherche, envoi, acceptation, rejet, expiration)
  - name: Health
    description: Endpoints de santé pour monitoring et load balancer

security:
  - BearerAuth: []

paths:
  # =============================================================================
  # AUTHENTICATION ENDPOINTS (Exemple de structure)
  # =============================================================================

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Créer un nouveau compte utilisateur
      description: |
        Inscription d'un nouvel utilisateur. Retourne un JWT valide après création.
        Le compte est créé avec le rôle `LENDER` par défaut.
      operationId: registerUser
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
            examples:
              basic:
                summary: Inscription basique
                value:
                  email: john.doe@example.com
                  password: SecureP@ssw0rd!
                  firstName: John
                  lastName: Doe
      responses:
        '201':
          description: Compte créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refreshToken: a3f1c9e7b2d84f6a1e0c5b9d7f3a2e8c4d6b0f1a2c3e5d7f9b1a4c6e8d0f2a48
                    expiresIn: 900
                    tokenType: Bearer
                    user:
                      id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                      email: john.doe@example.com
                      firstName: John
                      lastName: Doe
                      role: LENDER
                      createdAt: '2026-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                emailTaken:
                  value:
                    type: https://api.return.app/errors/email-already-exists
                    title: Email Already Exists
                    status: 409
                    detail: "The email 'john.doe@example.com' is already registered."
                    instance: /v1/auth/register
                    timestamp: 2026-02-08T14:32:00Z
                    requestId: req-7f3c9a2b

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Se connecter à un compte existant
      description: |
        Authentification par email + mot de passe. Retourne un access token (15 min)
        et un refresh token (30 jours).
      operationId: loginUser
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            examples:
              valid:
                value:
                  email: john.doe@example.com
                  password: SecureP@ssw0rd!
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidCredentials:
                  value:
                    type: https://api.return.app/errors/invalid-credentials
                    title: Invalid Credentials
                    status: 401
                    detail: Email or password is incorrect.
                    instance: /v1/auth/login
                    timestamp: 2026-02-08T14:35:00Z
                    requestId: req-8a4d1b3c
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Renouveler un access token expiré
      description: |
        Utilise le refresh token opaque pour obtenir un nouvel access token JWT.
        Le refresh token est à usage unique (rotation) : un nouveau refresh token
        est retourné à chaque appel. L'ancien token est immédiatement invalidé.
      operationId: refreshToken
      security: [] # Public endpoint (le refresh token est dans le body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
            examples:
              valid:
                value:
                  refreshToken: a3f1c9e7b2d84f6a1e0c5b9d7f3a2e8c4d6b0f1a2c3e5d7f9b1a4c6e8d0f2a48
      responses:
        '200':
          description: Token renouvelé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Se déconnecter (invalider les tokens)
      description: |
        Invalide immédiatement l'access token (ajouté à la blacklist Redis) et le
        refresh token. Le token ne peut plus être utilisé ni renouvelé.

        **V1** : Révocation immédiate via blacklist Redis (TTL = durée restante du token).
      operationId: logoutUser
      responses:
        '204':
          description: Déconnexion réussie (pas de contenu retourné)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # LOANS ENDPOINTS
  # =============================================================================

  /loans:
    get:
      tags:
        - Loans
      summary: Lister tous les prêts de l'utilisateur connecté
      description: |
        Récupère la liste des prêts de l'utilisateur connecté selon la perspective choisie.
        En mode 'lender' (défaut), retourne les prêts créés par l'utilisateur.
        En mode 'borrower', retourne les prêts où l'utilisateur est emprunteur.
        Par défaut, retourne uniquement les prêts actifs (non archivés).
      operationId: listLoans
      parameters:
        - name: status
          in: query
          description: Filtrer par statut de prêt (plusieurs valeurs possibles séparées par des virgules)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/LoanStatus'
          style: form
          explode: false
          example: [ACTIVE, AWAITING_RETURN]
        - name: borrowerId
          in: query
          description: |
            Filtrer par emprunteur (identifiant du contact emprunteur).
            Ce paramètre n'est pertinent qu'en mode `role=lender`. En mode `role=borrower`,
            il est ignoré car l'utilisateur connecté EST l'emprunteur.
          schema:
            type: string
            format: uuid
          example: 5d6e7f8a-1b2c-4d3e-a5f6-7a8b9c0d1e2f
        - name: includeArchived
          in: query
          description: Inclure les prêts archivés (rendus ou non rendus)
          schema:
            type: boolean
            default: false
          example: false
        - name: page
          in: query
          description: Numéro de page (commence à 1)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Nombre de résultats par page (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: sortBy
          in: query
          description: Champ de tri
          schema:
            type: string
            enum: [createdAt, returnDate, status]
            default: createdAt
          example: returnDate
        - name: sortOrder
          in: query
          description: Ordre de tri
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          example: asc
        - name: role
          in: query
          description: |
            Perspective de l'utilisateur. 'lender' retourne les prêts créés par l'utilisateur.
            'borrower' retourne les prêts où l'utilisateur est emprunteur.
            Par défaut 'lender'.
          schema:
            type: string
            enum: [lender, borrower]
            default: lender
          example: lender
      responses:
        '200':
          description: Liste des prêts récupérée avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Loan'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Loans
      summary: Créer un nouveau prêt
      description: |
        Créer un prêt avec un objet (existant ou nouveau) et un emprunteur existant (UUID).
        L'emprunteur doit être un contact avec invitation ACCEPTED (sinon 403).
        Un objet ou un contact référencé par UUID qui n'appartient pas au prêteur renvoie un 404,
        identique à celui d'un objet ou contact inexistant (pas de 403).
        Le statut initial est toujours PENDING_CONFIRMATION.
        Une notification de confirmation est automatiquement envoyée à l'emprunteur.
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoanDto'
            examples:
              newItemExistingBorrower:
                summary: Nouvel objet + contact existant (ACCEPTED)
                value:
                  item:
                    name: Perceuse Bosch PSB 1800
                    description: Perceuse-visseuse sans fil 18V
                    category: TOOLS
                    estimatedValue: 129.99
                  borrowerId: 5d6e7f8a-1b2c-4d3e-a5f6-7a8b9c0d1e2f
                  returnDate: '2026-03-15'
                  notes: 'Avec 2 batteries et chargeur'
              existingItemExistingBorrower:
                summary: Objet existant + contact existant
                value:
                  item: 8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d
                  borrowerId: 5d6e7f8a-1b2c-4d3e-a5f6-7a8b9c0d1e2f
                  returnDate: '2026-03-01'
              moneyLoan:
                summary: Prêt d'argent
                value:
                  item:
                    name: Prêt personnel
                    category: MONEY
                    estimatedValue: 500.00
                  borrowerId: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                  returnDate: '2026-04-15'
                  notes: 'Remboursement prévu fin avril'
      responses:
        '201':
          description: Prêt créé avec succès
          headers:
            Location:
              description: URI du prêt créé
              schema:
                type: string
                format: uri
                example: https://api.return.app/v1/loans/7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Validation error ou date de retour invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                validationError:
                  summary: Erreur de validation
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The submitted data is invalid.
                    instance: /v1/loans
                    timestamp: '2026-01-15T10:30:00Z'
                    requestId: req_example123
                invalidReturnDate:
                  summary: Date de retour dans le passé
                  value:
                    type: https://api.return.app/errors/invalid-return-date
                    title: Invalid Return Date
                    status: 400
                    detail: Return date must be in the future.
                    instance: /v1/loans
                    timestamp: '2026-01-15T10:30:00Z'
                    requestId: req_example123
                returnDateTooSoon:
                  summary: Date de retour trop proche (< J+2)
                  value:
                    type: https://api.return.app/errors/return-date-too-soon
                    title: Return Date Too Soon
                    status: 400
                    detail: Return date must be at least 2 days from now.
                    instance: /v1/loans
                    timestamp: '2026-01-15T10:30:00Z'
                    requestId: req_example123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Accès interdit — contact sans invitation acceptée (le prêteur est bien propriétaire du contact)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                contactNotAccepted:
                  summary: Contact sans invitation acceptée
                  value:
                    type: https://api.return.app/errors/contact-not-accepted
                    title: Contact Not Accepted
                    status: 403
                    detail: You can only create a loan for a contact with an ACCEPTED invitation.
                    instance: /v1/loans
                    timestamp: '2026-01-15T10:30:00Z'
                    requestId: req_example123
        '404':
          description: |
            L'objet ou l'emprunteur référencé par UUID n'existe pas **ou n'appartient pas au prêteur**
            (réponse identique dans les deux cas). Pour un contact : `borrower-not-found`.

            **Ordre des contrôles** : ces 404 (objet, puis contact appartenant à un autre utilisateur) sont décidés
            **avant** le 403 `contact-not-accepted`, de sorte que ce 403 ne révèle jamais l'existence du contact
            d'un autre utilisateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/item-not-found
                title: Item Not Found
                status: 404
                detail: "The item with ID '8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d' does not exist."
                instance: /v1/loans
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '429':
          description: Limite de création dépassée (15 prêts/jour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/daily-loan-limit-exceeded
                title: Daily Loan Limit Exceeded
                status: 429
                detail: You have reached the maximum of 15 loans per day.
                instance: /v1/loans
                timestamp: 2026-02-08T16:00:00Z
                requestId: req-1a2b3c4d
        '500':
          $ref: '#/components/responses/InternalServerError'

  /loans/{loanId}:
    parameters:
      - name: loanId
        in: path
        required: true
        description: Identifiant unique du prêt
        schema:
          type: string
          format: uuid
        example: 7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d

    get:
      tags:
        - Loans
      summary: Récupérer les détails d'un prêt
      description: |
        Retourne toutes les informations d'un prêt, y compris les objets, emprunteur,
        rappels planifiés et historique des changements de statut.

        **Accès** : Accessible par le prêteur (créateur du prêt) OU par l'emprunteur lié
        (dont le `Borrower.userId` correspond à l'utilisateur connecté).
        Un utilisateur tiers (ni prêteur, ni emprunteur) reçoit une erreur 404, identique à celle d'un prêt
        inexistant (pas de 403 : il n'existe aucun cas de partie au prêt sans droit de lecture).

        **Contenu de `borrower`** : `borrower.statistics` n'est présent que pour le prêteur ; voir la description
        de `Loan.borrower` (dont la décision, validée en revue de #40, sur le profil renvoyé à l'emprunteur).
      operationId: getLoanById
      responses:
        '200':
          description: Détails du prêt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Loans
      summary: Mettre à jour un prêt
      description: |
        Permet de modifier les notes ou certaines métadonnées du prêt.
        **Note** : Pour changer le statut, utiliser `/loans/{loanId}/status`.

        **Accès** : Seul le prêteur (créateur du prêt) peut modifier un prêt.
        L'emprunteur (partie sans droit) reçoit une erreur 403 ; un tiers reçoit un 404,
        identique à celui d'un prêt inexistant.
      operationId: updateLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnDate:
                  type: [string, 'null']
                  format: date
                  example: '2026-03-20'
                  description: |
                    Nouvelle date de retour prévue (null = indéfinie).
                    **Contrainte** : doit être au minimum 2 jours après la date du jour (J+2).
                    Si des rappels sont déjà planifiés, ils seront recalculés automatiquement.
                    **Statuts autorisés** : la date ne peut être modifiée (ou retirée) que pour un prêt
                    `PENDING_CONFIRMATION`, `ACTIVE` ou `ACTIVE_BY_DEFAULT`. Pour un prêt en retard
                    (`AWAITING_RETURN`) ou clos, la requête est refusée avec `409 loan-return-date-locked`.
                    Les notes restent modifiables quel que soit le statut.
                notes:
                  type: [string, 'null']
                  maxLength: 500
                  example: 'Retour décalé car travaux en cours'
      responses:
        '200':
          description: Prêt mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Données invalides ou date de retour trop proche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                validationError:
                  summary: Erreur de validation
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The request contains invalid data.
                    instance: /v1/loans/loan-123
                    timestamp: '2026-10-29T10:00:00Z'
                    requestId: req-3c4d5e6f
                    errors:
                      - field: notes
                        code: TOO_LONG
                        message: notes must be shorter than or equal to 500 characters
                returnDateTooSoon:
                  summary: Date de retour trop proche (< J+2)
                  value:
                    type: https://api.return.app/errors/return-date-too-soon
                    title: Return Date Too Soon
                    status: 400
                    detail: Return date must be at least 2 days from now.
                    instance: /v1/loans/loan-123
                    timestamp: '2026-10-29T10:00:00Z'
                    requestId: req-3c4d5e6f
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La date de retour ne peut plus être modifiée : le prêt est en retard (`AWAITING_RETURN`)
            ou clos (`RETURNED`, `NOT_RETURNED`, `ABANDONED`, `CONTESTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/loan-return-date-locked
                title: Return Date Locked
                status: 409
                detail: The return date can only be changed while the loan is pending or active.
                instance: /v1/loans/loan-123
                timestamp: 2026-10-28T10:00:00Z
                requestId: req-9a8b7c6d

    delete:
      tags:
        - Loans
      summary: Supprimer un prêt (soft delete)
      description: |
        Archive le prêt (soft delete). Le prêt reste en base mais est marqué comme supprimé.
        Les rappels planifiés sont automatiquement annulés.

        **Accès** : Seul le prêteur (créateur du prêt) peut supprimer un prêt.
        L'emprunteur (partie sans droit) reçoit une erreur 403 ; un tiers reçoit un 404,
        identique à celui d'un prêt inexistant.

        **Attention** : Cette action est irréversible (pas de restauration en V1).
      operationId: deleteLoan
      responses:
        '204':
          description: Prêt supprimé avec succès (pas de contenu retourné)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Impossible de supprimer un prêt déjà rendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/loan-already-returned
                title: Cannot Delete Returned Loan
                status: 409
                detail: You cannot delete a loan that has already been returned.
                instance: /v1/loans/loan-123
                timestamp: 2026-02-08T16:30:00Z
                requestId: req-5e6f7a8b

  /loans/{loanId}/status:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags:
        - Loans
      summary: Changer le statut d'un prêt
      description: |
        Permet les transitions de statut suivantes selon le rôle :

        **Prêteur (propriétaire du prêt)** :
        - `ACTIVE` → `RETURNED` (confirmer retour)
        - `ACTIVE_BY_DEFAULT` → `RETURNED` (confirmer retour après confirmation automatique)
        - `AWAITING_RETURN` → `RETURNED` (confirmer retour tardif)
        - `ACTIVE` / `ACTIVE_BY_DEFAULT` / `AWAITING_RETURN` → `ABANDONED` (abandon manuel)

        **Emprunteur** :
        - `PENDING_CONFIRMATION` → `ACTIVE` (accepter)
        - `PENDING_CONFIRMATION` → `CONTESTED` (refuser)

        **Système (automatique)** :
        - `PENDING_CONFIRMATION` → `ACTIVE_BY_DEFAULT` (timeout 48h sans réponse de l'emprunteur)
        - `ACTIVE` / `ACTIVE_BY_DEFAULT` → `AWAITING_RETURN` (date de retour dépassée)
        - `AWAITING_RETURN` → `NOT_RETURNED` (clôture quand le dernier rappel `FINAL_OVERDUE` (J+21) est envoyé **ou en échec** (`FAILED`) pour l'échéance actuelle ; règle en cours de révision, voir décision du 31/10)

        Les transitions invalides retournent une erreur 409 Conflict.

        **Accès** : le prêteur et l'emprunteur du prêt (parties) reçoivent un 403 si la transition n'est pas
        permise à leur rôle. Un tiers reçoit un 404 identique à celui d'un prêt inexistant.
      operationId: updateLoanStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoanStatusDto'
            examples:
              confirmReturn:
                summary: Prêteur confirme le retour
                value:
                  status: RETURNED
                  notes: 'Rendu en bon état le 14/03'
              borrowerAccepts:
                summary: Emprunteur accepte le prêt
                value:
                  status: ACTIVE
              borrowerRefuses:
                summary: Emprunteur conteste le prêt
                value:
                  status: CONTESTED
                  notes: "Je n'ai jamais emprunté cet objet"
      responses:
        '200':
          description: Statut mis à jour avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Transition de statut non autorisée pour votre rôle (partie au prêt uniquement ; un tiers reçoit un 404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/forbidden-status-transition
                title: Forbidden Status Transition
                status: 403
                detail: Only the borrower can confirm or contest a loan.
                instance: /v1/loans/loan-123/status
                timestamp: 2026-02-08T17:00:00Z
                requestId: req-9a8b7c6d
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transition de statut invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invalid-status-transition
                title: Invalid Status Transition
                status: 409
                detail: 'Cannot transition from RETURNED to ACTIVE.'
                instance: /v1/loans/loan-123/status
                timestamp: 2026-02-08T17:05:00Z
                requestId: req-1b2c3d4e

  /loans/{loanId}/confirm:
    post:
      tags:
        - Loans
      summary: Confirmer un prêt (emprunteur uniquement)
      description: |
        Raccourci pour l'emprunteur : accepter le prêt en une seule action.
        Équivalent à `PATCH /loans/{loanId}/status` avec `status: ACTIVE`.

        **Accès** : réservé à l'emprunteur. Le prêteur (partie sans droit) reçoit un 403 ; un tiers reçoit
        un 404 identique à celui d'un prêt inexistant.
      operationId: confirmLoan
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Prêt confirmé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Le prêt a déjà été confirmé ou contesté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /loans/{loanId}/contest:
    post:
      tags:
        - Loans
      summary: Contester un prêt (emprunteur uniquement)
      description: |
        L'emprunteur refuse le prêt (il nie l'avoir emprunté).
        Le statut passe à CONTESTED et les rappels sont désactivés.

        **Accès** : réservé à l'emprunteur. Le prêteur (partie sans droit) reçoit un 403 ; un tiers reçoit
        un 404 identique à celui d'un prêt inexistant.
      operationId: contestLoan
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: "Je n'ai jamais emprunté cet objet. Il doit y avoir une erreur."
      responses:
        '200':
          description: Prêt contesté avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Le prêt a déjà été confirmé, contesté ou est dans un état terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invalid-status-transition
                title: Invalid Status Transition
                status: 409
                detail: Cannot transition from RETURNED to CONTESTED.
                instance: /v1/loans/loan-123/contest
                timestamp: 2026-02-08T17:10:00Z
                requestId: req-4c5d6e7f

