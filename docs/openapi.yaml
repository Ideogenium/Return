      summary: Lister tous les rappels d'un prêt
      description: |
        Récupère la liste de tous les rappels planifiés et envoyés pour ce prêt.

        **Accès** : réservé au prêteur. L'emprunteur du prêt (partie sans droit) reçoit un 403 ;
        un tiers reçoit un 404 identique à celui d'un prêt inexistant.
      operationId: getLoanReminders
      responses:
        '200':
          description: Liste des rappels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reminders/{reminderId}:
    parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
