                $ref: '#/components/schemas/BorrowerStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /borrowers/{borrowerId}/loans:
    parameters:
      - name: borrowerId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Borrowers
      summary: Lister tous les prêts d'un emprunteur
      description: |
        Récupère l'historique complet des prêts pour cet emprunteur.

        **Accès** : réservé au prêteur propriétaire du contact (l'appelant est donc toujours le prêteur des prêts
        renvoyés, qui incluent `borrower.statistics`). Pour tout autre utilisateur, la réponse est un 404,
        identique à celle d'un contact inexistant (pas de 403).
      operationId: getBorrowerLoans
      parameters:
        - name: status
          in: query
          description: Filtrer par statut
          schema:
