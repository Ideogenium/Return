      - name: borrowerId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Borrowers
      summary: Récupérer les statistiques de fiabilité d'un emprunteur
      description: |
        Retourne les statistiques détaillées de fiabilité d'un emprunteur, incluant le score de confiance et les délais moyens de retour.

        **Accès** : réservé au prêteur propriétaire du contact. Pour tout autre utilisateur, la réponse est un 404,
        identique à celle d'un contact inexistant (pas de 403).
      operationId: getBorrowerStatistics
      responses:
        '200':
          description: Statistiques détaillées
          content:
            application/json:
