          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reminders/{reminderId}/cancel:
    parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Reminders
      summary: Annuler un rappel planifié
      description: |
        Annule un rappel qui n'a pas encore été envoyé.
        Utilisé notamment quand le prêt est rendu avant la date prévue.

        **Accès** : réservé au prêteur du prêt associé. L'emprunteur du prêt (partie sans droit) reçoit un 403 ;
        un tiers reçoit un 404 identique à celui d'un rappel inexistant.
      operationId: cancelReminder
