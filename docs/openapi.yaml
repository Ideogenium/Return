                timestamp: 2026-02-08T20:15:00Z
                requestId: req-4b5c6d7e

  # =============================================================================
  # NOTIFICATIONS ENDPOINTS
  # =============================================================================

  /notifications:
    get:
      tags:
        - Notifications
      summary: Lister toutes les notifications de l'utilisateur
      description: |
        Récupère les notifications push reçues (rappels, confirmations, invitations de contact, etc.).
        Les données jointes au push correspondant sont décrites par `PushNotificationData`.
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          description: Afficher uniquement les notifications non lues
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Liste des notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags:
        - Notifications
      summary: Marquer une notification comme lue
      description: |
        Met à jour le statut d'une notification pour la marquer comme lue.

        Une notification appartient à un seul utilisateur : si elle n'est pas la vôtre, la réponse est un 404,
        identique à celle d'une notification inexistante (pas de 403).
      operationId: markNotificationAsRead
      responses:
        '204':
          description: Notification marquée comme lue
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags:
        - Notifications
      summary: Marquer toutes les notifications comme lues
      description: Met à jour le statut de toutes les notifications non lues de l'utilisateur pour les marquer comme lues.
      operationId: markAllNotificationsAsRead
      responses:
        '204':
          description: Toutes les notifications marquées comme lues
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/device-token:
    post:
      tags:
        - Notifications
      summary: Enregistrer ou mettre à jour le token FCM du device
      description: |
        Enregistre le token Firebase Cloud Messaging (FCM) du device de l'utilisateur
        pour recevoir les notifications push. Appelé au démarrage de l'app et à chaque
        rafraîchissement du token FCM.

        Si un token existe déjà pour ce device, il est mis à jour.
        Un utilisateur peut avoir plusieurs tokens (plusieurs devices).
      operationId: registerDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - platform
              properties:
                token:
                  type: string
                  description: Token FCM du device
                  example: 'fMI-QUBYRE...:APA91bH...'
                platform:
                  type: string
                  enum: [ios, android, web]
                  description: Plateforme du device
                  example: android
      responses:
        '204':
          description: Token enregistré avec succès
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Notifications
      summary: Supprimer le token FCM du device (désinscription push)
      description: |
        Supprime le token FCM du device courant. Appelé lors du logout
        pour arrêter de recevoir les notifications push sur ce device.
      operationId: unregisterDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Token FCM à supprimer
                  example: 'fMI-QUBYRE...:APA91bH...'
      responses:
        '204':
          description: Token supprimé avec succès
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/device-token-not-found
                title: Device Token Not Found
                status: 404
                detail: The specified device token was not found.
                instance: /v1/notifications/device-token
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123

  # =============================================================================
  # USERS ENDPOINTS
  # =============================================================================

  /users/me:
    get:
      tags:
        - Users
      summary: Récupérer le profil utilisateur
      description: Retourne le profil complet de l'utilisateur authentifié.
      operationId: getUserProfile
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Users
      summary: Mettre à jour le profil utilisateur
      description: Permet de modifier les informations du profil (nom, prénom, email) de l'utilisateur authentifié.
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 50
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 50
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email déjà utilisé par un autre utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      tags:
        - Users
      summary: Supprimer définitivement le compte
      description: |
        Suppression irréversible du compte. Conforme au RGPD (droit à l'effacement) et à la règle
        App Store 5.1.1(v) (suppression du compte depuis l'app). Décision : FIX-22, ADR 0010.

        **Ordre des contrôles** : le mot de passe est vérifié en premier (`401 invalid-current-password`),
        puis les prêts en cours : `409 active-loans-exist` tant que l'utilisateur est le prêteur d'un prêt
        en cours (`PENDING_CONFIRMATION`, `ACTIVE`, `ACTIVE_BY_DEFAULT`, `AWAITING_RETURN`). Ses emprunts
        en cours chez d'autres prêteurs ne bloquent pas la suppression.

        **Effacé** :
        - le compte : reconnexion impossible (`POST /auth/login` répond comme pour un compte inexistant),
          adresse email libérée, mot de passe, téléphone, photo de profil, préférences et date de dernière
          connexion effacés ;
        - les sessions : refresh tokens supprimés ; un access token encore valable (15 min au plus) reçoit
          `401 invalid-token` sur toute route ;
        - les téléphones enregistrés pour les notifications push ;
        - ses notifications et ses invitations de contact, envoyées et reçues ;
        - les notifications d'autres utilisateurs qui le nomment ;
        - toutes ses photos stockées (photo de profil et photos de ses objets) ;
        - ses prêts supprimés (`deletedAt`) ;
        - ses prêts clos dont le contact emprunteur n'est relié à aucun compte (personne ne peut plus
          les voir), avec leurs objets et contacts ;
        - ses objets et ses contacts qui ne figurent dans aucun prêt conservé ;
        - les textes libres qu'il a écrits : description de ses objets et notes de ses prêts.

        **Conservé, pseudonymisé** : ses prêts clos (tout statut hors des 4 en cours, `CONTESTED` compris)
        dont le contact emprunteur est relié à un compte restent dans l'historique de cet emprunteur. Le
        prêteur y apparaît avec `accountDeleted: true`, les noms fixes `Compte` / `supprimé` et
        `profilePicture: null`. L'objet garde son nom, sa catégorie et sa valeur, sans photo ni
        description ; le prêt garde ses dates et son statut, sans notes. Le contact de l'emprunteur garde
        ses noms et son email, sans téléphone. Si aucun prêt n'est conservé, le compte est entièrement
        supprimé, sans trace.

        **Ses emprunts** : s'il était emprunteur chez d'autres prêteurs, leurs contacts et leurs prêts
        restent inchangés pour eux, mais ne sont plus reliés à un compte (`Borrower.userId: null`) : il
        ne reçoit plus aucun rappel. Le motif de contestation (`contestReason`) qu'il a écrit est conservé,
        car il explique le statut du prêt au prêteur.

        **Nouvelle inscription avec la même adresse** : elle crée un nouveau compte, et les contacts qui le
        représentaient chez d'autres prêteurs s'y relient par email, comme pour toute inscription : le
        nouveau compte retrouve l'historique et le score de confiance d'emprunteur de l'ancien.
      operationId: deleteUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - confirmationText
              properties:
                password:
                  type: string
                  format: password
                  description: Mot de passe pour confirmer
                confirmationText:
                  type: string
                  enum: ['DELETE MY ACCOUNT']
                  description: 'Doit être exactement "DELETE MY ACCOUNT"'
      responses:
        '204':
          description: Compte supprimé avec succès
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Mot de passe incorrect, vérifié avant les prêts en cours : un mauvais mot de passe reçoit ce 401
            même si des prêts en cours existent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invalid-current-password
                title: Invalid Current Password
                status: 401
                detail: The provided password is incorrect.
                instance: /v1/users/me
                timestamp: 2026-02-08T21:30:00Z
                requestId: req-5c6d7e8f
        '409':
          description: Des prêts en cours existent (le mot de passe est correct)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/active-loans-exist
                title: Active Loans Exist
                status: 409
                detail: Cannot delete account while active loans exist. Please close all loans first.
                instance: /v1/users/me
                timestamp: 2026-02-08T21:30:00Z
                requestId: req-6d7e8f9a

  /users/me/trust-score:
    get:
      tags:
        - Users
      summary: Récupérer le score de confiance global de l'utilisateur
      description: |
        Score de confiance global de l'utilisateur authentifié **en tant qu'emprunteur**,
        agrégé sur tous les prêteurs (toutes ses fiches contact confondues). Source de
        vérité unique, consommée aussi bien sur le profil que sur la fiche contact (FIX-15).
      operationId: getMyTrustScore
      responses:
        '200':
          description: Score de confiance global
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTrustScore'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/settings:
    get:
      tags:
        - Users
      summary: Récupérer les paramètres utilisateur
      description: Retourne les paramètres de notification et les préférences de l'utilisateur authentifié.
      operationId: getUserSettings
      responses:
        '200':
          description: Paramètres utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Users
      summary: Mettre à jour les paramètres
      description: Permet de modifier les paramètres de notification, la langue et le fuseau horaire de l'utilisateur.
      operationId: updateUserSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Paramètres mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    put:
      tags:
        - Users
      summary: Mettre à jour la photo de profil
      description: Upload ou remplace la photo de profil de l'utilisateur authentifié (JPEG ou PNG, max 2MB).
      operationId: updateUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image au format JPEG ou PNG (max 2MB)
      responses:
        '200':
          description: Photo de profil mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  profilePicture:
                    type: string
                    format: uri
                    example: https://photos.return.app/users/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/avatar-7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f.jpg
        '400':
          description: |
            Fichier refusé. Les erreurs portent sur le champ `avatar` (nom de la partie multipart) : `TOO_LARGE`
            au-delà de 2 Mo, `FILE_REQUIRED` s'il est absent ou ni JPEG ni PNG, `VALIDATION_ERROR` si le corps
            multipart est refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                fileTooLarge:
                  summary: Fichier plus lourd que 2 Mo
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The request contains invalid data.
                    instance: /v1/users/me/avatar
                    timestamp: 2026-10-31T19:00:00Z
                    requestId: req-2a3b4c5d
                    errors:
                      - field: avatar
                        code: TOO_LARGE
                        message: File too large
                fileTypeRefused:
                  summary: Type de fichier refusé (ni JPEG ni PNG)
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The request contains invalid data.
                    instance: /v1/users/me/avatar
                    timestamp: 2026-10-31T19:00:00Z
                    requestId: req-3b4c5d6e
                    errors:
                      - field: avatar
                        code: FILE_REQUIRED
                        message: Validation failed (current file type is image/gif, expected type is /(jpeg|jpg|png)$/)
                fileMissing:
                  summary: Aucun fichier dans la partie `avatar`
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The request contains invalid data.
                    instance: /v1/users/me/avatar
                    timestamp: 2026-10-31T19:00:00Z
                    requestId: req-4c5d6e7f
                    errors:
                      - field: avatar
                        code: FILE_REQUIRED
                        message: File is required
                multipartRejected:
                  summary: Corps multipart refusé (fichier en trop, trop de champs, champ trop long)
                  value:
                    type: https://api.return.app/errors/validation-failed
                    title: Validation Failed
                    status: 400
                    detail: The request contains invalid data.
                    instance: /v1/users/me/avatar
                    timestamp: 2026-10-31T19:00:00Z
                    requestId: req-5d6e7f8a
                    errors:
                      - field: avatar
                        code: VALIDATION_ERROR
                        message: Too many files
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Users
      summary: Supprimer la photo de profil
      description: Supprime la photo de profil de l'utilisateur authentifié.
      operationId: deleteUserAvatar
      responses:
        '204':
          description: Photo de profil supprimée avec succès
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Aucune photo de profil à supprimer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /users/me/password:
    patch:
      tags:
        - Users
      summary: Changer le mot de passe
      description: Permet de changer le mot de passe de l'utilisateur authentifié en fournissant le mot de passe actuel et le nouveau.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: OldP@ssw0rd!
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 100
                  pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
                  example: NewSecureP@ssw0rd!
      responses:
        '204':
          description: Mot de passe changé avec succès
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Mot de passe actuel incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invalid-current-password
                title: Invalid Current Password
                status: 401
                detail: The current password you provided is incorrect.
                instance: /v1/users/me/password
                timestamp: 2026-02-08T21:00:00Z
                requestId: req-5c6d7e8f

  # =============================================================================
  # HISTORY ENDPOINTS
  # =============================================================================

  /history/loans:
    get:
      tags:
        - History
      summary: Récupérer l'historique des prêts archivés
      description: |
        Liste des prêts terminés (rendus ou non rendus).
      operationId: getLoansHistory
      parameters:
        - name: status
          in: query
          description: Filtrer par statut final
          schema:
            type: array
            items:
              type: string
              enum: [RETURNED, NOT_RETURNED, CONTESTED, ABANDONED]
          style: form
          explode: false
        - name: borrowerId
          in: query
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          description: Date de début de période
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: endDate
          in: query
          description: Date de fin de période
          schema:
            type: string
            format: date
          example: '2026-12-31'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Historique des prêts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Loan'
                  pagination:
                    $ref: '#/components/schemas/PaginationMetadata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /history/statistics:
    get:
      tags:
        - History
      summary: Récupérer les statistiques globales de prêt
      description: |
        Statistiques détaillées sur l'utilisation de l'application par l'utilisateur.
      operationId: getUserStatistics
      responses:
        '200':
          description: Statistiques globales
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview:
                    type: object
                    properties:
                      totalLoans:
                        type: integer
                        example: 42
                        description: Nombre total de prêts créés
                      activeLoans:
                        type: integer
                        example: 5
                        description: Prêts actuellement en cours
                      returnedLoans:
                        type: integer
                        example: 35
                        description: Prêts rendus avec succès
                      notReturnedLoans:
                        type: integer
                        example: 2
                        description: Prêts non rendus
                      contestedLoans:
                        type: integer
                        example: 0
                        description: Prêts contestés
                      overdueLoans:
                        type: integer
                        example: 1
                        description: |
                          Prêts en retard : prêts encore ouverts (ACTIVE, ACTIVE_BY_DEFAULT, AWAITING_RETURN),
                          non supprimés, dont la `returnDate` est renseignée et strictement antérieure à la date
                          du jour (UTC). Un prêt dont l'échéance est aujourd'hui est à l'heure ; un prêt sans
                          `returnDate` n'est jamais en retard. Un prêt en retard reste aussi compté dans
                          `activeLoans`. Différent de `notReturnedLoans` (prêts clos définitivement).
                      averageReturnDelay:
                        type: number
                        format: float
                        example: -1.5
                        description: Délai moyen de retour en jours (+ = retard, - = avance)
                  byCategory:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          $ref: '#/components/schemas/ItemCategory'
                        count:
                          type: integer
                          example: 12
                        totalValue:
                          type: [number, 'null']
                          format: float
                          example: 450.00
                  topBorrowers:
                    type: array
                    description: Top 5 emprunteurs les plus actifs
                    items:
                      type: object
                      properties:
                        borrower:
                          $ref: '#/components/schemas/UserSummary'
                        loanCount:
                          type: integer
                          example: 8
                        trustScore:
                          type: [number, 'null']
                          format: float
                          example: 92.5
                          description: Score de confiance global de l'emprunteur (null si pas encore noté)
                  mostLoanedItems:
                    type: array
                    description: Top 5 objets les plus prêtés
                    items:
                      type: object
                      properties:
                        item:
                          $ref: '#/components/schemas/Item'
                        loanCount:
                          type: integer
                          example: 6
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # HEALTH CHECK ENDPOINTS
  # =============================================================================

  /health:
    get:
      tags:
        - Health
      summary: Vérification de santé basique (liveness)
      description: |
        Retourne le statut du serveur. Utilisé par le load balancer Fly.io
        pour déterminer si l'instance est vivante.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Serveur opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-02-12T10:00:00Z'
                  version:
                    type: string
                    example: '1.0.0'

  /ready:
    get:
      tags:
        - Health
      summary: Vérification de disponibilité (readiness)
      description: |
        Vérifie que toutes les dépendances sont opérationnelles
        (PostgreSQL, Redis, FCM). Utilisé pour le routing du load balancer.
      operationId: readinessCheck
      security: []
      responses:
        '200':
          description: Toutes les dépendances opérationnelles
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [ok, error]
                        example: ok
                      redis:
                        type: string
                        enum: [ok, error]
                        example: ok
                      fcm:
                        type: string
                        enum: [ok, error]
                        example: ok
        '503':
          description: Une ou plusieurs dépendances indisponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: error
                      fcm:
                        type: string
                        example: ok

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtenu via `/auth/login` ou `/auth/register`.
        Format : `Authorization: Bearer <access_token>`

        Le token expire après 15 minutes. Utiliser `/auth/refresh` pour le renouveler.

  schemas:
    # =========================================================================
    # DOMAIN ENTITIES (basées sur le Dictionnaire du Domaine)
    # =========================================================================

    Loan:
      type: object
      description: |
        Prêt enregistré : un Objet (physique) ou de l'Argent est temporairement
        transféré d'un Prêteur à un Emprunteur avec expectative de retour.
        Deux workflows distincts selon la catégorie de l'item :
        - **OBJECT** (catégories != MONEY) : photo, retour physique
        - **MONEY** (catégorie = MONEY) : montant, remboursement
      required:
        - id
        - item
        - lender
        - borrower
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
          description: Identifiant unique du prêt
        item:
          $ref: '#/components/schemas/Item'
        lender:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          description: |
            Prêteur du prêt. S'il a supprimé son compte (FIX-22), `accountDeleted: true`, noms fixes
            `Compte` / `supprimé` et `profilePicture: null`.
        borrower:
          allOf:
            - $ref: '#/components/schemas/Borrower'
          description: |
            Emprunteur du prêt. Le contenu dépend de l'appelant :
            - **Appelant = prêteur** : le contact tel que le prêteur l'a saisi (prénom, nom, email, `phoneNumber`)
              avec `statistics`.
            - **Appelant = emprunteur** : `statistics` est **omis** (les statistiques de fiabilité sont réservées
              au prêteur).

            **Décision validée en revue de #40** : quand l'appelant est l'emprunteur, `borrower` contient
            son **propre profil** (`firstName`, `lastName` et `email` de son compte utilisateur), sans `phoneNumber`
            (numéro noté par le prêteur) ni `statistics` ; `id` (identifiant du contact) et `userId` (son propre
            identifiant) restent présents. Le nom donné par le prêteur dans ses contacts reste réservé au prêteur.
            Cette variante reste conforme au schéma `Borrower` : `phoneNumber` et `statistics` ne font pas
            partie des champs requis.
        returnDate:
          type: [string, 'null']
          format: date
          example: '2026-03-15'
          description: |
            Date de retour prévue (null = indéfinie).
            Contrainte : minimum J+2 (2 jours après la date du jour, jour calendaire UTC), à la création comme à la modification.
        status:
          $ref: '#/components/schemas/LoanStatus'
        confirmationDate:
          type: [string, 'null']
          format: date-time
          example: '2026-02-08T14:30:00Z'
          description: Date de confirmation par l'emprunteur (null si non confirmé)
        returnedDate:
          type: [string, 'null']
          format: date-time
          example: '2026-03-14T10:00:00Z'
          description: Date effective du retour (null si non rendu)
        notes:
          type: [string, 'null']
          maxLength: 500
          example: 'Perceuse avec 2 batteries et chargeur'
          description: Notes optionnelles du prêteur
        contestReason:
          type: [string, 'null']
          minLength: 10
          maxLength: 500
          example: "Je n'ai jamais emprunté cet objet. Il doit y avoir une erreur."
          description: |
            Raison de contestation fournie par l'emprunteur (null si le prêt n'a pas été contesté).
            Renseigné uniquement via POST /loans/{loanId}/contest.
        createdAt:
          type: string
          format: date-time
          example: '2026-02-08T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-02-08T14:30:00Z'

    LoanStatus:
      type: string
      enum:
        - PENDING_CONFIRMATION
        - ACTIVE
        - ACTIVE_BY_DEFAULT
        - CONTESTED
        - AWAITING_RETURN
        - RETURNED
        - NOT_RETURNED
        - ABANDONED
      description: |
        Statut du prêt :
        - **PENDING_CONFIRMATION** : Prêt créé, en attente de confirmation de l'emprunteur
        - **ACTIVE** : Prêt confirmé par l'emprunteur, en cours
        - **ACTIVE_BY_DEFAULT** : Non confirmé mais accepté implicitement (timeout 48h)
        - **CONTESTED** : Prêt refusé/contesté par l'emprunteur
        - **AWAITING_RETURN** : Date de retour dépassée, rappels automatiques en cours
        - **RETURNED** : Objet restitué / argent remboursé, prêt clos avec succès
        - **NOT_RETURNED** : Objet non restitué après les 5 rappels automatiques (PREVENTIVE, ON_DUE_DATE, FIRST_OVERDUE, SECOND_OVERDUE, FINAL_OVERDUE)
        - **ABANDONED** : Prêt abandonné manuellement par le prêteur
      example: ACTIVE

    Item:
      type: object
      description: Bien physique ou somme d'argent faisant l'objet d'un Prêt
      required:
        - id
        - name
        - category
      properties:
        id:
          type: string
          format: uuid
          example: 9a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Perceuse Bosch PSB 1800
          description: Nom de l'objet (saisie manuelle)
        description:
          type: [string, 'null']
          maxLength: 500
          example: Perceuse-visseuse sans fil 18V avec 2 batteries Li-Ion
        category:
          $ref: '#/components/schemas/ItemCategory'
        estimatedValue:
          type: [number, 'null']
          format: float
          minimum: 0
          example: 129.99
          description: |
            Valeur estimée de l'objet en euros (optionnelle).
            **Obligatoire** si category = MONEY (constitue alors le montant prêté).
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          description: Photos de l'objet (max 5)
          maxItems: 5
        createdAt:
          type: string
          format: date-time
          example: '2026-02-08T14:00:00Z'

    ItemCategory:
      type: string
      enum:
        - TOOLS
        - BOOKS
        - ELECTRONICS
        - SPORTS
        - KITCHEN
        - GARDEN
        - MONEY
        - OTHER
      description: |
        Catégorie de l'objet sélectionnée manuellement par le prêteur.
        **MONEY** active le workflow de prêt d'argent (estimatedValue = montant prêté, obligatoire).
        Les autres catégories concernent des prêts d'objets physiques (workflow standard avec photo).
      example: TOOLS

    Photo:
      type: object
      description: Photo d'un objet stockée sur Cloudflare R2
      required:
        - id
        - url
        - uploadedAt
      properties:
        id:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        url:
          type: string
          format: uri
          example: https://photos.return.app/users/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/items/9a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d.jpg
          description: URL publique et permanente de la photo
        thumbnailUrl:
          type: [string, 'null']
          format: uri
          example: null
          description: URL de la vignette optimisée (150x150px). Toujours `null` en V1 (pas de génération de vignettes).
        uploadedAt:
          type: string
          format: date-time
          example: '2026-02-08T14:05:00Z'

    Borrower:
      type: object
      description: |
        Personne physique à qui un objet ou de l'argent est prêté.
        Doit être un utilisateur inscrit sur Return.
        La relation Contact est établie via une invitation mutuellement acceptée (`POST /contact-invitations`).
        Un prêt ne peut être créé que pour un contact dont l'invitation est en statut ACCEPTED.
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 5d6e7f8a-1b2c-4d3e-a5f6-7a8b9c0d1e2f
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: Marie
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Dupont
        email:
          type: string
          format: email
          example: marie.dupont@example.com
          description: Email de l'emprunteur (obligatoire, sert d'identifiant pour le lien de compte)
        phoneNumber:
          type: [string, 'null']
          example: '+33612345678'
          description: Numéro de téléphone (chiffré en base)
        userId:
          type: [string, 'null']
          format: uuid
          example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          description: ID utilisateur Return (null si invitation en attente)
        statistics:
          allOf:
            - $ref: '#/components/schemas/BorrowerStatistics'
          description: |
            Statistiques de fiabilité de l'emprunteur, **privées au prêteur** : le champ est présent
            uniquement quand l'appelant est le prêteur du prêt (ou propriétaire du contact). Il est **omis**
            (jamais `null`) dans toutes les autres réponses, notamment quand l'appelant est l'emprunteur du prêt.

    BorrowerStatistics:
      type: object
      description: Statistiques de fiabilité d'un emprunteur
      properties:
        totalLoans:
          type: integer
          example: 12
          description: Nombre total de prêts reçus
        returnedOnTime:
          type: integer
          example: 10
          description: Nombre de prêts rendus à temps
        returnedLate:
          type: integer
          example: 1
          description: Nombre de prêts rendus en retard
        notReturned:
          type: integer
          example: 1
          description: Nombre de prêts non rendus (abandonné)
        averageReturnDelay:
          type: [integer, 'null']
          example: 2
          description: Délai moyen de retour en jours (+ = retard, - = avance, null si aucun prêt rendu)
        trustScore:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 100
          example: 87.5
          description: |
            Score de confiance **global** de l'emprunteur lié, agrégé sur tous les prêteurs
            (FIX-15), calculé sur les prêts **résolus** uniquement :
            (Σ returnedOnTime * 100 + Σ returnedLate * 50) / Σ(returnedOnTime + returnedLate + notReturned).
            Les prêts CONTESTÉS et en cours sont exclus. Identique à GET /users/me/trust-score.
            **null** si le contact n'a aucun prêt résolu ou n'est pas encore lié à un compte.

    UserTrustScore:
      type: object
      description: |
        Score de confiance global d'un utilisateur en tant qu'emprunteur, agrégé sur
        tous les prêteurs ayant une relation avec lui (FIX-15).
      properties:
        trustScore:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 100
          example: 87.5
          description: |
            (Σ returnedOnTime * 100 + Σ returnedLate * 50) / Σ(returnedOnTime + returnedLate + notReturned),
            tous prêteurs confondus, sur les prêts résolus uniquement. **null** si aucun prêt résolu.
        totalLoans:
          type: integer
          example: 12
          description: Nombre total de prêts reçus, tous prêteurs confondus
        returnedOnTime:
          type: integer
          example: 10
        returnedLate:
          type: integer
          example: 1
        notReturned:
          type: integer
          example: 1

    Reminder:
      type: object
      description: |
        Rappel automatique envoyé à l'emprunteur via push notification.
        Les rappels sont 100% automatiques (pas de rappel manuel) et utilisent
        des templates prédéfinis avec pool aléatoire de messages diplomatiques.
      required:
        - id
        - loanId
        - type
        - status
        - scheduledFor
      properties:
        id:
          type: string
          format: uuid
          example: 3c4d5e6f-7a8b-4c9d-ae1f-2a3b4c5d6e7f
        loanId:
          type: string
          format: uuid
          example: 7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
        type:
          $ref: '#/components/schemas/ReminderType'
        status:
          $ref: '#/components/schemas/ReminderStatus'
        scheduledFor:
          type: string
          format: date-time
          example: '2026-03-12T09:00:00Z'
          description: Date/heure programmée d'envoi
        sentAt:
          type: [string, 'null']
          format: date-time
          example: '2026-03-12T09:00:15Z'
          description: Date/heure d'envoi effectif (null si non envoyé)
        message:
          type: string
          example: 'Bonjour Marie, petit rappel amical : le retour de Perceuse Bosch PSB 1800 est prévu pour le 15/03/2026.'
          description: Message envoyé (template personnalisé ou par défaut)
        channel:
          $ref: '#/components/schemas/NotificationChannel'

    ReminderType:
      type: string
      enum:
        - PREVENTIVE
        - ON_DUE_DATE
        - FIRST_OVERDUE
        - SECOND_OVERDUE
        - FINAL_OVERDUE
      description: |
        Type de rappel (politique fixe, 5 rappels automatiques) :
        - **PREVENTIVE** : Rappel préventif **adaptatif** — planifié à **J-3** si le délai avant retour (Δ) ≥ 3 jours, sinon à **J-1** (la veille). La contrainte de date minimum J+2 garantit que Δ ≥ 2, donc le PREVENTIVE est toujours envoyé avant l'échéance.
        - **ON_DUE_DATE** : Le jour de la date de retour (J)
        - **FIRST_OVERDUE** : 7 jours après la date de retour (J+7)
        - **SECOND_OVERDUE** : 14 jours après (J+14)
        - **FINAL_OVERDUE** : 21 jours après (J+21, dernier rappel avant passage en NOT_RETURNED)

        Chaque rappel utilise un template prédéfini avec pool aléatoire de messages
        diplomatiques, sélectionné automatiquement par tier. Pas de rappel manuel.

        **Règle de planification du PREVENTIVE** :
        ```
        Δ = returnDate - createdAt (en jours)
        Si Δ ≥ 3 → PREVENTIVE planifié à returnDate - 3 jours (J-3)
        Si Δ < 3 → PREVENTIVE planifié à returnDate - 1 jour  (J-1)
        ```
      example: PREVENTIVE

    ReminderStatus:
      type: string
      enum:
        - SCHEDULED
        - SENT
        - FAILED
        - CANCELLED
      description: |
        Statut du rappel :
        - **SCHEDULED** : Planifié, non encore envoyé
        - **SENT** : Envoyé avec succès
        - **FAILED** : Échec d'envoi (retry prévu)
        - **CANCELLED** : Annulé (prêt rendu avant l'envoi)
      example: SENT

    NotificationChannel:
      type: string
      enum:
        - PUSH
      description: |
        Canal de notification (V1 : push uniquement) :
        - **PUSH** : Notification push mobile via Firebase Cloud Messaging (FCM)

        V2+ ajoutera EMAIL et SMS.
      example: PUSH

    User:
      type: object
      description: Utilisateur inscrit de l'application (peut être Prêteur et/ou Emprunteur)
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        email:
          type: string
          format: email
          example: john.doe@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Doe
        role:
          $ref: '#/components/schemas/UserRole'
        profilePicture:
          type: [string, 'null']
          format: uri
          example: https://photos.return.app/users/a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d/avatar-7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f.jpg
        settings:
          $ref: '#/components/schemas/UserSettings'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:00:00Z'
        lastLoginAt:
          type: [string, 'null']
          format: date-time
          example: '2026-02-08T14:00:00Z'

    UserRole:
      type: string
      enum:
        - LENDER
      description: |
        Rôle de l'utilisateur (V1 : rôle unique) :
        - **LENDER** : Utilisateur inscrit (peut prêter et emprunter)

        Note : tout utilisateur peut être à la fois Prêteur et Emprunteur selon le contexte.
        Le rôle ADMIN n'est pas prévu en V1.
      example: LENDER

    UserSettings:
      type: object
      description: Paramètres de notification et préférences utilisateur
      properties:
        pushNotificationsEnabled:
          type: boolean
          example: true
          description: Activer/désactiver les notifications push
        reminderEnabled:
          type: boolean
          example: true
          description: Activer/désactiver les rappels automatiques
        language:
          type: string
          enum: [fr, en]
          example: fr
          description: Langue de l'interface et des notifications (V1 — FR et EN)
        timezone:
          type: string
          example: Europe/Paris
          description: Fuseau horaire pour la planification des rappels

    Notification:
      type: object
      description: |
        Notification push reçue par l'utilisateur (V1 — push uniquement via FCM).

        Chaque notification est aussi envoyée en push à l'appareil de l'utilisateur ; les données jointes
        à ce push (`data`) sont décrites par le schéma `PushNotificationData`.
      required:
        - id
        - type
        - title
        - body
        - isRead
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: d1e2f3a4-b5c6-4d7e-8f9a-0b1c2d3e4f5a
        type:
          type: string
          enum:
            - LOAN_CREATED
            - LOAN_CONFIRMED
            - LOAN_AUTO_CONFIRMED
            - LOAN_CONTESTED
            - LOAN_RETURNED
            - REMINDER_SENT
            - REMINDER_RECEIVED
            - CONTACT_INVITATION_RECEIVED
            - CONTACT_INVITATION_ACCEPTED
          example: LOAN_CONFIRMED
          description: |
            Type de notification.
            - `LOAN_CREATED` : un prêt a été enregistré pour l'emprunteur (reçue par l'emprunteur).
            - `LOAN_CONFIRMED` : l'emprunteur a confirmé le prêt (reçue par le prêteur).
            - `LOAN_AUTO_CONFIRMED` : le prêt a été confirmé automatiquement après 48 h (reçue par le prêteur et l'emprunteur).
            - `LOAN_CONTESTED` : l'emprunteur a contesté le prêt (reçue par le prêteur).
            - `LOAN_RETURNED` : le prêteur a confirmé le retour (reçue par l'emprunteur).
            - `REMINDER_SENT` : un rappel a été envoyé à l'emprunteur (reçue par le prêteur).
            - `REMINDER_RECEIVED` : un rappel concerne l'emprunteur (reçue par l'emprunteur).
            - `CONTACT_INVITATION_RECEIVED` : une invitation de contact vient d'être envoyée
              (reçue par le **destinataire** de l'invitation, à l'envoi).
            - `CONTACT_INVITATION_ACCEPTED` : une invitation de contact a été acceptée
              (reçue par l'**auteur** de l'invitation, au moment de l'acceptation).

            Le refus et l'expiration d'une invitation ne génèrent **pas** de notification.

            **Compatibilité** : un client qui ne connaît pas un type (ancien build) l'ignore sans erreur :
            icône par défaut dans la liste, et un tap sur le push sans `loanId` n'a aucun effet.
        title:
          type: string
          example: Prêt confirmé
        body:
          type: string
          example: 'Marie Dupont a confirmé avoir emprunté votre Perceuse Bosch PSB 1800.'
        isRead:
          type: boolean
          example: false
        relatedLoanId:
          type: [string, 'null']
          format: uuid
          example: 7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
          description: |
            ID du prêt associé (null si notification système).
            Toujours `null` pour `CONTACT_INVITATION_RECEIVED` et `CONTACT_INVITATION_ACCEPTED` :
            la ressource Notification ne porte pas d'identifiant d'invitation (il figure dans les données du push,
            voir `PushNotificationData`).
        createdAt:
          type: string
          format: date-time
          example: '2026-02-08T14:30:00Z'

    PushNotificationData:
      type: object
      description: |
        Données (`data`) jointes à chaque notification push envoyée à l'appareil. Toutes les valeurs sont
        des chaînes de caractères. Ce schéma décrit le push, pas la ressource `Notification` renvoyée par
        `GET /notifications`.

        **Prêts** (`LOAN_*`) : `{ loanId, type }` où `type` est le type de la notification (ex. `LOAN_CONFIRMED`).
        **Rappels** : `{ loanId, reminderId, type: 'REMINDER' }` (envoyé au prêteur et à l'emprunteur ; `REMINDER`
        est une valeur propre au push, distincte de `REMINDER_SENT` / `REMINDER_RECEIVED`).
        **Invitations de contact** : `{ type: 'CONTACT_INVITATION_RECEIVED' | 'CONTACT_INVITATION_ACCEPTED', invitationId }`
        (pas de `loanId`).

        **Comportement au tap dans l'application** :
        - présence de `loanId` : ouverture du détail du prêt (seule donnée lue par les builds actuels) ;
        - `CONTACT_INVITATION_RECEIVED` : écran Contacts, onglet des invitations reçues (**cible de FIX-27**, à
          implémenter par FIX-27 ; les builds installés ignorent ce type : tap sans effet) ;
        - `CONTACT_INVITATION_ACCEPTED` : écran Contacts, onglet des invitations envoyées (**cible de FIX-27**,
          même remarque) ;
        - aucune donnée exploitable (ancien build qui ne connaît pas le type) : le tap n'a aucun effet.

        **Cas limite** : si l'invitation a été annulée ou a expiré avant le tap, la notification
        `CONTACT_INVITATION_RECEIVED` reste dans la liste et ouvre simplement la liste des invitations
        (comportement accepté).
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Type du push. **N'est pas toujours une valeur de `Notification.type`** : les pushs de rappel
            envoient `REMINDER`, valeur propre au push qui n'existe pas dans l'enum `Notification.type`
            (celui-ci porte `REMINDER_SENT` / `REMINDER_RECEIVED`).
          enum:
            - LOAN_CREATED
            - LOAN_CONFIRMED
            - LOAN_AUTO_CONFIRMED
            - LOAN_CONTESTED
            - LOAN_RETURNED
            - REMINDER
            - CONTACT_INVITATION_RECEIVED
            - CONTACT_INVITATION_ACCEPTED
          example: CONTACT_INVITATION_RECEIVED
        loanId:
          type: string
          format: uuid
          description: Présent pour les push de prêt et de rappel ; absent pour les invitations.
          example: 7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
        reminderId:
          type: string
          format: uuid
          description: Présent uniquement pour les push de rappel (`type = REMINDER`).
          example: 3b2a1c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        invitationId:
          type: string
          format: uuid
          description: Présent uniquement pour les push d'invitation de contact.
          example: 6e5d4c3b-2a19-4f8e-9d7c-6b5a4f3e2d1c

    PaginationMetadata:
      type: object
      description: Métadonnées de pagination pour les listes paginées
      required:
        - currentPage
        - totalPages
        - totalItems
        - itemsPerPage
      properties:
        currentPage:
          type: integer
          example: 1
          description: Page actuelle (commence à 1)
        totalPages:
          type: integer
          minimum: 0
          example: 5
          description: Nombre total de pages. Retourne 0 lorsque la liste est vide.
        totalItems:
          type: integer
          example: 87
          description: Nombre total d'éléments
        itemsPerPage:
          type: integer
          example: 20
          description: Nombre d'éléments par page
        hasNextPage:
          type: boolean
          example: true
          description: Y a-t-il une page suivante ?
        hasPreviousPage:
          type: boolean
          example: false
          description: Y a-t-il une page précédente ?

    UserSummary:
      type: object
      description: Version résumée d'un utilisateur (pour les relations)
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        profilePicture:
          type: [string, 'null']
          format: uri
          example: https://photos.return.app/users/b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e/avatar-4e5f6a7b-8c9d-4e0f-9a1b-2c3d4e5f6a7b.jpg
        accountDeleted:
          type: boolean
          example: true
          description: |
            Utilisé seulement dans `Loan.lender`, jamais ailleurs. Présent et `true` uniquement quand le
            prêteur a supprimé son compte (FIX-22, voir `DELETE /users/me`) ; **omis** sinon. `firstName` et
            `lastName` portent alors les valeurs fixes `Compte` / `supprimé`, enregistrées en base, et
            `profilePicture` vaut `null`. Les builds qui ignorent cette propriété affichent ces valeurs
            telles quelles ; les suivants affichent un libellé traduit.

    # =========================================================================
    # DATA TRANSFER OBJECTS (DTOs)
    # =========================================================================

    RegisterDto:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
          example: SecureP@ssw0rd!
          description: |
            Minimum 8 caractères avec :
            - Au moins 1 majuscule
            - Au moins 1 minuscule
            - Au moins 1 chiffre
            - Au moins 1 caractère spécial (@$!%*?&)
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Doe

    LoginDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: SecureP@ssw0rd!

    RefreshTokenDto:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: a3f1c9e7b2d84f6a1e0c5b9d7f3a2e8c4d6b0f1a2c3e5d7f9b1a4c6e8d0f2a48
          description: |
            Token de rafraîchissement opaque reçu dans la réponse AuthResponse.
            Le token est à usage unique : chaque appel à /auth/refresh retourne un nouveau refresh token.

    AuthResponse:
      type: object
      description: Réponse d'authentification avec access token JWT et refresh token opaque
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLTEyMyIsInJvbGUiOiJMRU5ERVIiLCJpYXQiOjE2MDk0NTkyMDAsImV4cCI6MTYwOTQ2MDEwMH0.signature
          description: JWT access token (expire après 15 min)
        refreshToken:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: a3f1c9e7b2d84f6a1e0c5b9d7f3a2e8c4d6b0f1a2c3e5d7f9b1a4c6e8d0f2a48
          description: |
            Token de rafraîchissement opaque (64 caractères hex).
            Généré via crypto.randomBytes, stocké côté serveur sous forme de hash SHA-256.
            Expire après 30 jours. Rotation à chaque utilisation (l'ancien token est invalidé).
        expiresIn:
          type: integer
          example: 900
          description: Durée de validité de l'access token en secondes (15 min = 900s)
        tokenType:
          type: string
          example: Bearer
          description: Type de token (toujours "Bearer")
        user:
          $ref: '#/components/schemas/User'

    CreateLoanDto:
      type: object
      required:
        - item
        - borrowerId
      properties:
        item:
          oneOf:
            - $ref: '#/components/schemas/CreateItemDto'
            - type: string
              format: uuid
              description: ID d'un objet existant
        borrowerId:
          type: string
          format: uuid
          description: |
            ID d'un emprunteur existant (contact avec invitation ACCEPTED).
            La création inline de Borrower n'est plus supportée — utiliser le
            système d'invitation (`POST /contact-invitations`) pour établir un contact.
        returnDate:
          type: [string, 'null']
          format: date
          example: '2026-03-15'
          description: |
            Date de retour prévue (null = indéfinie).
            **Contrainte** : doit être au minimum 2 jours après la date du jour (J+2, jour calendaire UTC).
            Exemple : si la requête est faite le 16/03, la date de retour minimum est le 18/03.
            Retourne une erreur 400 si la contrainte n'est pas respectée.
        notes:
          type: [string, 'null']
          maxLength: 500
          example: 'Avec 2 batteries et chargeur'

    CreateItemDto:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Perceuse Bosch PSB 1800
        description:
          type: [string, 'null']
          maxLength: 500
          example: Perceuse-visseuse sans fil 18V
        category:
          $ref: '#/components/schemas/ItemCategory'
        estimatedValue:
          type: [number, 'null']
          format: float
          minimum: 0
          example: 129.99

    # =========================================================================
    # CONTACT INVITATIONS SCHEMAS
    # =========================================================================

    InvitationStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - EXPIRED
      description: |
        Cycle de vie d'une invitation de contact.
        `PENDING` → `ACCEPTED` | `REJECTED` | `EXPIRED` (après 30 jours sans réponse)

    ContactInvitation:
      type: object
      required:
        - id
        - status
        - senderUser
        - recipientEmail
        - recipientUser
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        status:
          $ref: '#/components/schemas/InvitationStatus'
        senderUser:
          type: object
          required:
            - id
            - firstName
            - lastName
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
              example: Jean
            lastName:
              type: string
              example: Martin
        recipientEmail:
          type: string
          format: email
          example: marie.dupont@example.com
        recipientUser:
          type: object
          description: Informations du destinataire (toujours renseigné car le destinataire doit être inscrit)
          required:
            - id
            - firstName
            - lastName
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
              example: Marie
            lastName:
              type: string
              example: Dupont
        createdAt:
          type: string
          format: date-time
          example: '2026-03-05T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2026-04-04T10:00:00Z'
        acceptedAt:
          type: [string, 'null']
          format: date-time
          example: null
        rejectedAt:
          type: [string, 'null']
          format: date-time
          example: null

    UserSearchResult:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - alreadyContact
      properties:
        id:
          type: string
          format: uuid
          example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        firstName:
          type: string
          example: Marie
        lastName:
          type: string
          example: Dupont
        email:
          type: string
          format: email
          example: marie.dupont@example.com
        alreadyContact:
          type: boolean
          description: Vrai si une invitation ACCEPTED existe déjà entre ces deux utilisateurs
          example: false
        pendingInvitation:
          type: boolean
          description: Vrai si une invitation PENDING existe déjà pour cet utilisateur
          example: false
        pendingInvitationId:
          type: [string, 'null']
          format: uuid
          description: ID de l'invitation PENDING existante (null si aucune invitation en cours). Permet d'annuler l'invitation via DELETE.
          example: null

    PaginatedContactInvitations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactInvitation'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    PaginatedUserSearchResults:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchResult'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    CreateBorrowerDto:
      type: object
      deprecated: true
      description: |
        **Déprécié** — Utiliser le système d'invitation (`POST /contact-invitations`) pour établir
        une relation de contact avec consentement mutuel.
        Ce DTO est conservé pour compatibilité interne. La création de Borrower se fait désormais
        automatiquement lors de l'acceptation d'une invitation (`POST /contact-invitations/{id}/accept`).
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: Marie
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Dupont
        email:
          type: string
          format: email
          example: marie.dupont@example.com
          description: Email obligatoire (identifiant de compte Return)
        phoneNumber:
          type: [string, 'null']
          example: '+33612345678'

    UpdateLoanStatusDto:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/LoanStatus'
        notes:
          type: [string, 'null']
          maxLength: 500
          description: Raison du changement de statut (optionnel)

    # =========================================================================
    # ERROR RESPONSES (RFC 7807)
    # =========================================================================

    ProblemDetails:
      type: object
      description: |
        Format standardisé RFC 7807 pour toutes les erreurs API.
        Documentation : https://tools.ietf.org/html/rfc7807
      required:
        - type
        - title
        - status
        - detail
        - instance
        - timestamp
        - requestId
      properties:
        type:
          type: string
          format: uri
          example: https://api.return.app/errors/loan-not-found
          description: URI identifiant le type d'erreur
        title:
          type: string
          example: Loan Not Found
          description: Titre court lisible par un humain
        status:
          type: integer
          example: 404
          description: Code HTTP de l'erreur
        detail:
          type: string
          example: "The loan with ID 'loan-123' does not exist or you don't have access to it."
          description: Explication détaillée de l'erreur
        instance:
          type: string
          example: /v1/loans/loan-123
          description: URI de la requête ayant causé l'erreur
        timestamp:
          type: string
          format: date-time
          example: '2026-02-08T14:32:00Z'
          description: Date/heure de l'erreur
        requestId:
          type: string
          example: req-7f3c9a2b-4d1e-4a8f-9c7b-1e3f5a6b8c9d
          description: ID unique de la requête (pour traçabilité)
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Liste des erreurs de validation (optionnel)

    ErrorDetail:
      type: object
      description: Détail d'une erreur de validation sur un champ spécifique
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          example: returnDate
          description: Nom du champ en erreur
        code:
          type: string
          enum:
            - REQUIRED
            - INVALID_TYPE
            - INVALID_EMAIL
            - INVALID_ENUM
            - INVALID_UUID
            - INVALID_FORMAT
            - INVALID_VALUE
            - TOO_SHORT
            - TOO_LONG
            - TOO_SMALL
            - TOO_LARGE
            - UNKNOWN_FIELD
            - FILE_REQUIRED
            - VALIDATION_ERROR
          example: INVALID_EMAIL
          description: |
            Code d'erreur stable, à utiliser pour l'i18n (le `message` est en anglais et peut changer).
            - `REQUIRED` : champ obligatoire vide
            - `INVALID_TYPE` : type inattendu (ex. nombre au lieu d'une chaîne)
            - `INVALID_EMAIL` : adresse e-mail mal formée
            - `INVALID_ENUM` : valeur hors de la liste autorisée
            - `INVALID_UUID` : identifiant qui n'est pas un UUID (corps ou chemin)
            - `INVALID_FORMAT` : valeur qui ne respecte pas le motif (`pattern`) du champ
            - `INVALID_VALUE` : valeur différente de celle attendue (ex. confirmation)
            - `TOO_SHORT` / `TOO_LONG` : longueur hors de `minLength` / `maxLength`
            - `TOO_SMALL` / `TOO_LARGE` : nombre hors de `minimum` / `maximum` ; `TOO_LARGE` signale aussi un
              fichier envoyé plus lourd que la limite de la route (erreur sur le champ du fichier, comme
              `TOO_LONG` pour une chaîne)
            - `UNKNOWN_FIELD` : champ non prévu par le contrat
            - `FILE_REQUIRED` : fichier absent ou de type refusé (upload)
            - `VALIDATION_ERROR` : toute autre règle (ex. date mal formée, corps multipart refusé)
        message:
          type: string
          example: email must be an email
          description: Message d'erreur lisible (anglais, non destiné à l'affichage direct)

  # ===========================================================================
  # REUSABLE RESPONSES
  # ===========================================================================

  responses:
    Unauthorized:
      description: Non authentifié (token manquant ou invalide)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            missingToken:
              value:
                type: https://api.return.app/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: No authorization token was found in the request headers.
                instance: /v1/loans
                timestamp: 2026-02-08T14:32:00Z
                requestId: req-9b8c7d6e
            invalidToken:
              value:
                type: https://api.return.app/errors/invalid-token
                title: Invalid Token
                status: 401
                detail: The provided token is invalid or has expired.
                instance: /v1/loans
                timestamp: 2026-02-08T14:35:00Z
                requestId: req-1a2b3c4d

    Forbidden:
      description: |
        Accès interdit : l'appelant est **partie à la ressource** (par exemple l'emprunteur d'un prêt,
        l'émetteur ou le destinataire d'une invitation) mais n'a pas le droit d'effectuer cette action.
        Un tiers (ni partie, ni propriétaire) ne reçoit jamais de 403 : il reçoit le 404 `NotFound`,
        identique à celui d'une ressource inexistante (voir la règle générale dans la description de l'API).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notOwner:
              summary: Partie sans droit (emprunteur qui tente de modifier un prêt)
              value:
                type: https://api.return.app/errors/forbidden
                title: Forbidden
                status: 403
                detail: You can only access or modify loans you created.
                instance: /v1/loans/loan-123
                timestamp: 2026-02-08T14:40:00Z
                requestId: req-5e6f7a8b

    NotFound:
      description: |
        Ressource introuvable **ou qui n'appartient pas à l'appelant** (tiers). Réponse partagée par les prêts,
        objets, contacts, rappels, notifications, photos et invitations.
        Pour une même ressource, les deux cas renvoient une réponse strictement identique (même `type`, même `title`,
        même `detail`), afin qu'il soit impossible de deviner l'existence d'une ressource en testant des identifiants.
        Seuls `instance`, `timestamp` et `requestId` varient d'une requête à l'autre.

        `type` et `title` dépendent de la ressource : `NotFoundException('Item', id)` produit
        `https://api.return.app/errors/item-not-found`, `title` « Item Not Found » et `detail`
        `The item with ID '<id>' does not exist.` (format `The <ressource> with ID '<id>' does not exist.`).
        Exception : pour les invitations, le `detail` est
        `The invitation does not exist or does not belong to you.` (sans identifiant).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            itemNotFound:
              summary: Objet introuvable ou appartenant à un autre utilisateur
              value:
                type: https://api.return.app/errors/item-not-found
                title: Item Not Found
                status: 404
                detail: "The item with ID '8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d' does not exist."
                instance: /v1/items/8a9b0c1d-2e3f-4a5b-6c7d-8e9f0a1b2c3d
                timestamp: 2026-02-08T14:45:00Z
                requestId: req-9c8d7e6f
            borrowerNotFound:
              summary: Contact introuvable ou appartenant à un autre utilisateur
              value:
                type: https://api.return.app/errors/borrower-not-found
                title: Borrower Not Found
                status: 404
                detail: "The borrower with ID 'b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e' does not exist."
                instance: /v1/borrowers/b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e
                timestamp: 2026-02-08T14:45:00Z
                requestId: req-9c8d7e6f
            reminderNotFound:
              summary: Rappel introuvable ou appartenant à un autre utilisateur
              value:
                type: https://api.return.app/errors/reminder-not-found
                title: Reminder Not Found
                status: 404
                detail: "The reminder with ID '3b2a1c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d' does not exist."
                instance: /v1/reminders/3b2a1c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                timestamp: 2026-02-08T14:45:00Z
                requestId: req-9c8d7e6f
            invitationNotFound:
              summary: Invitation introuvable ou dont l'appelant n'est pas la personne autorisée
              value:
                type: https://api.return.app/errors/invitation-not-found
                title: Invitation Not Found
                status: 404
                detail: The invitation does not exist or does not belong to you.
                instance: /v1/contact-invitations/6e5d4c3b-2a19-4f8e-9d7c-6b5a4f3e2d1c/accept
                timestamp: 2026-02-08T14:45:00Z
                requestId: req-9c8d7e6f
            loanNotFound:
              value:
                type: https://api.return.app/errors/loan-not-found
                title: Loan Not Found
                status: 404
                detail: "The loan with ID 'loan-999' does not exist."
                instance: /v1/loans/loan-999
                timestamp: 2026-02-08T14:45:00Z
                requestId: req-9c8d7e6f

    ValidationError:
      description: Erreur de validation des données d'entrée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            multipleErrors:
              value:
                type: https://api.return.app/errors/validation-failed
                title: Validation Failed
                status: 400
                detail: The request contains invalid data.
                instance: /v1/auth/register
                timestamp: 2026-02-08T14:50:00Z
                requestId: req-1f2e3d4c
                errors:
                  - field: email
                    code: INVALID_EMAIL
                    message: Email format is invalid
                  - field: password
                    code: TOO_SHORT
                    message: Password must be at least 8 characters

    RateLimitExceeded:
      description: Limite de taux dépassée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            tooManyRequests:
              value:
                type: https://api.return.app/errors/rate-limit-exceeded
                title: Rate Limit Exceeded
                status: 429
                detail: You have exceeded the limit of 10 login attempts per 15 minutes.
                instance: /v1/auth/login
                timestamp: 2026-02-08T15:00:00Z
                requestId: req-6a7b8c9d
      headers:
        Retry-After:
          description: Nombre de secondes avant de pouvoir réessayer
          schema:
            type: integer
            example: 900
        X-RateLimit-Limit:
          description: Limite totale de requêtes
          schema:
            type: integer
            example: 10
        X-RateLimit-Remaining:
          description: Nombre de requêtes restantes
          schema:
            type: integer
            example: 0
        X-RateLimit-Reset:
          description: Timestamp de réinitialisation du compteur
          schema:
            type: integer
            example: 1675869600

    PayloadTooLarge:
      description: |
        Corps JSON plus lourd que la limite du serveur (100 Ko). Réponse produite avant la route, commune à
        toutes les routes à corps JSON (voir la règle transversale dans `info.description`). Ne concerne pas
        les fichiers `multipart/form-data`, qui reçoivent un 400 `TOO_LARGE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            jsonBodyTooLarge:
              value:
                type: https://api.return.app/errors/payload-too-large
                title: Payload Too Large
                status: 413
                detail: The request body is larger than the 102400-byte limit.
                instance: /v1/loans
                timestamp: 2026-10-31T19:00:00Z
                requestId: req-7d8e9f0a

    UnsupportedMediaType:
      description: |
        Jeu de caractères ou encodage du corps non pris en charge. Réponse produite avant la route, commune à
        toutes les routes à corps (voir `info.description`). Le `type` est le type générique `http-error` ;
        `title` et `detail` reprennent le message du lecteur du corps.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unsupportedCharset:
              value:
                type: https://api.return.app/errors/http-error
                title: unsupported charset "KLINGON"
                status: 415
                detail: unsupported charset "KLINGON"
                instance: /v1/loans
                timestamp: 2026-10-31T19:00:00Z
                requestId: req-8e9f0a1b

    InternalServerError:
      description: Erreur interne du serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            generic:
              value:
                type: https://api.return.app/errors/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred while processing your request.
                instance: /v1/loans
                timestamp: 2026-02-08T15:10:00Z
                requestId: req-2b3c4d5e
