        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================================================
  # CONTACT INVITATIONS ENDPOINTS
  # =============================================================================

  /contact-invitations/search:
    post:
      tags:
        - ContactInvitations
      summary: Rechercher des utilisateurs inscrits
      description: |
        Recherche des utilisateurs inscrits sur Return par email, prénom ou nom.
        Exclut l'utilisateur courant, les contacts déjà acceptés et les comptes supprimés (FIX-22).
        Indique le statut de la relation (nouveau / invitation en attente / déjà contact).
      operationId: searchUsersForInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 2
                  description: Terme de recherche (email, prénom ou nom)
                  example: marie
                page:
                  type: integer
                  default: 1
                limit:
                  type: integer
                  default: 20
                  maximum: 50
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserSearchResults'
        '400':
          $ref: '#/components/responses/ValidationError'

  /contact-invitations:
    post:
      tags:
        - ContactInvitations
      summary: Envoyer une invitation de contact
      description: |
        Envoie une invitation à un utilisateur inscrit pour l'ajouter à son carnet de contacts.
        L'invitation expire automatiquement après 30 jours.
        Erreurs possibles : 400 self-invitation, 404 utilisateur introuvable, 409 invitation déjà envoyée.

        Le destinataire reçoit une notification `CONTACT_INVITATION_RECEIVED` (voir `PushNotificationData`).
      operationId: sendContactInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientEmail
              properties:
                recipientEmail:
                  type: string
                  format: email
                  description: Email de l'utilisateur à inviter (doit être inscrit)
                  example: marie.dupont@example.com
      responses:
        '201':
          description: Invitation envoyée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInvitation'
        '400':
          description: Auto-invitation (impossible de s'inviter soi-même)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/self-invitation
                title: Self Invitation
                status: 400
                detail: You cannot send an invitation to yourself.
                instance: /v1/contact-invitations
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '404':
          description: Utilisateur introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/user-not-found
                title: User Not Found
                status: 404
                detail: No registered user found with this email address.
                instance: /v1/contact-invitations
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '409':
          description: Invitation déjà envoyée et en attente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-already-sent
                title: Invitation Already Sent
                status: 409
                detail: A pending invitation already exists for this email.
                instance: /v1/contact-invitations
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
    get:
      tags:
        - ContactInvitations
      summary: Lister les invitations (reçues ou envoyées)
      description: |
        Retourne la liste des invitations de l'utilisateur connecté.
        Utiliser `direction=received` (défaut) pour les invitations reçues (perspective emprunteur),
        ou `direction=sent` pour les invitations envoyées (perspective prêteur).
        Filtrable par statut.
      operationId: listInvitations
      parameters:
        - name: direction
          in: query
          required: false
          description: Direction des invitations à lister
          schema:
            type: string
            enum:
              - sent
              - received
            default: received
        - name: status
          in: query
          required: false
          description: Filtrer par statut d'invitation
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Liste des invitations (reçues ou envoyées)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactInvitations'

  /contact-invitations/{invitationId}/accept:
    post:
      tags:
        - ContactInvitations
      summary: Accepter une invitation de contact
      description: |
        L'emprunteur (destinataire) accepte l'invitation. Cette action crée automatiquement
        un Borrower dans le carnet de contacts de l'émetteur et émet l'événement
        `ContactInvitationAccepted`. Seul le destinataire peut accepter.

        L'auteur de l'invitation reçoit une notification `CONTACT_INVITATION_ACCEPTED`.

        **Accès** : tout utilisateur autre que le destinataire (l'auteur de l'invitation compris) reçoit un 404
        identique à celui d'une invitation inexistante (pas de 403). Ce 404 est décidé **avant** tout 409
        (`invitation-not-pending`) : un non-destinataire ne peut donc pas sonder l'état de l'invitation.
      operationId: acceptContactInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invitation acceptée — contact créé chez l'émetteur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInvitation'
        '404':
          description: Invitation introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-not-found
                title: Invitation Not Found
                status: 404
                detail: The invitation does not exist or does not belong to you.
                instance: /v1/contact-invitations/inv-123/accept
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '409':
          description: Invitation déjà traitée (non PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-not-pending
                title: Invitation Not Pending
                status: 409
                detail: This invitation has already been accepted, rejected, or expired.
                instance: /v1/contact-invitations/inv-123/accept
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123

  /contact-invitations/{invitationId}/reject:
    post:
      tags:
        - ContactInvitations
      summary: Refuser une invitation de contact
      description: |
        L'emprunteur (destinataire) refuse l'invitation. Aucun contact n'est créé.
        Seul le destinataire peut refuser. Retourne 409 si l'invitation n'est plus PENDING.
        Le refus ne génère aucune notification.

        **Accès** : tout utilisateur autre que le destinataire (l'auteur de l'invitation compris) reçoit un 404
        identique à celui d'une invitation inexistante (pas de 403). Ce 404 est décidé **avant** tout 409
        (`invitation-not-pending`) : un non-destinataire ne peut donc pas sonder l'état de l'invitation.
      operationId: rejectContactInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation refusée
        '404':
          description: Invitation introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-not-found
                title: Invitation Not Found
                status: 404
                detail: The invitation does not exist or does not belong to you.
                instance: /v1/contact-invitations/inv-123/reject
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '409':
          description: Invitation déjà traitée (non PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-not-pending
                title: Invitation Not Pending
                status: 409
                detail: This invitation has already been accepted, rejected, or expired.
                instance: /v1/contact-invitations/inv-123/reject
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123

  /contact-invitations/{invitationId}:
    delete:
      tags:
        - ContactInvitations
      summary: Annuler une invitation envoyée
      description: |
        Le prêteur (émetteur) annule une invitation PENDING qu'il a envoyée.
        Impossible d'annuler une invitation déjà acceptée.

        **Accès** : tout utilisateur autre que l'émetteur (le destinataire compris) reçoit un 404
        identique à celui d'une invitation inexistante (pas de 403). Ce 404 est décidé **avant** tout 409
        (`invitation-already-accepted`) : un non-émetteur ne peut donc pas sonder l'état de l'invitation.
        Si l'invitation est annulée, la notification
        `CONTACT_INVITATION_RECEIVED` déjà envoyée au destinataire reste dans sa liste et ouvre simplement
        la liste des invitations.
      operationId: cancelContactInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation annulée
        '404':
          description: Invitation introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-not-found
                title: Invitation Not Found
                status: 404
                detail: The invitation does not exist or does not belong to you.
                instance: /v1/contact-invitations/inv-123
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123
        '409':
          description: Impossible d'annuler une invitation déjà acceptée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.return.app/errors/invitation-already-accepted
                title: Invitation Already Accepted
                status: 409
                detail: Cannot cancel an invitation that has already been accepted.
                instance: /v1/contact-invitations/inv-123
                timestamp: '2026-01-15T10:30:00Z'
                requestId: req_example123

