name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test -- --coverage --passWithNoTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  db-e2e:
    # FIX-22: account deletion relies on real Postgres behaviour (RESTRICT foreign keys, one
    # transaction, row locks). This spec is skipped locally unless DB_E2E_DATABASE_URL is set.
    name: E2E on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ret
          POSTGRES_PASSWORD: ret
          POSTGRES_DB: ret
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ret -d ret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_E2E_DATABASE_URL: 'postgresql://ret:ret@localhost:55432/ret'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply the migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DB_E2E_DATABASE_URL }}
      - name: Account deletion on a real database
        run: npm run test:e2e -- --runInBand account-deletion.db

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g @stoplight/spectral-cli
      - run: spectral lint docs/openapi.yaml --ruleset docs/.spectral.yaml
