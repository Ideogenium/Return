app = 'return-api'
primary_region = 'cdg'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  API_PREFIX = 'v1'
  LOG_LEVEL = 'info'
  # Photos are stored on Cloudflare R2: the five R2_* variables are Fly secrets
  # (`fly secrets set`, never here). The app refuses to start in production
  # without them, so set the secrets BEFORE deploying a version that needs them.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # CORR-01: keep one machine always running so the in-process CRON jobs
  # (reminders, 24h/48h auto-confirmation, invitation expiry) actually fire.
  # With 0, the machine sleeps when idle and the scheduled jobs never run —
  # which would break Return's core promise (automatic reminders).
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
